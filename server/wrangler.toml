name = "fsp-anchor"
main = "worker.js"
compatibility_date = "2026-01-01"

# 先创建 KV：npx wrangler kv namespace create ANCHOR
# 把命令输出的 id 填到下面
[[kv_namespaces]]
binding = "ANCHOR"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 可选：自定义域名/路由
# [[routes]]
# pattern = "anchor.fushengpai.example/*"
# zone_name = "example.com"
