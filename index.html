<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>浮生牌</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="appRoot">
    <!-- 顶部导航 -->
    <div class="top-nav"></div>
    <!-- 步骤条 -->
    <div class="step-row" id="stepRow">
      <div id="sd1" class="step-dot"></div>
      <div id="sd2" class="step-dot"></div>
      <div id="sd3" class="step-dot"></div>
    </div>

    <!-- 主容器：三栏布局的结构基底 -->
    <div id="dynamicPanels" class="main-grid">
      <!-- 栏 1：体用信息区（在大屏时固定显示在左侧） -->
      <div id="tiyongArea" class="grid-col">
        <div class="tiyong-bar" id="tiyongBar"></div>
      </div>
      <!-- 栏 2：核心交互区（九宫格和牌堆） -->
      <div id="coreArea" class="grid-col">
        <!-- 动态内容由 ui-render 注入 -->
      </div>
      <!-- 栏 3：解读与结果区（大屏时固定在右侧） -->
      <div id="resultArea" class="grid-col"></div>
    </div>
  </div>

  <!-- 全局组件 -->
  <div id="toast" hidden></div>
  <div id="modal" hidden><div id="modalContent"></div></div>
  <div id="sharePreview" hidden><canvas id="shareCanvas"></canvas><div class="btn-row"><button data-action="saveShareImage">保存</button><button data-action="closeShare">关闭</button></div></div>
  
  <script type="module" src="/src/ui.js"></script>
</body>
</html>
