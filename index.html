<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
  <title>浮生牌 · 观牌知势</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <!-- 第八轮修复：确保内联 display:flex 不会覆盖 hidden 属性 -->
  <style>
    #fortuneTypeModal[hidden],
    #toast[hidden],
    #sharePreview[hidden],
    #modal[hidden],
    .static-panel[hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="appRoot">
    <header class="header">
      <div class="logo">浮生牌</div>
      <nav class="top-btns">
        <button data-action="togglePanel" data-panel="teaching">教程</button>
        <button data-action="togglePanel" data-panel="rules">规则</button>
        <button data-action="togglePanel" data-panel="settings">AI</button>
        <button data-action="togglePanel" data-panel="profile">个人</button>
        <button data-action="togglePanel" data-panel="history">历史</button>
        <button data-action="showDataMigration">📦 迁移</button>
        <button data-action="durianReport">🍈 报告</button>
        <button data-action="sharePersona">🃏 人格卡</button>
        <button data-action="shareDaily">☯ 日运卡</button>
        <button data-action="openRepo">🌐 开源</button>
        <button data-action="showReward">☕ 赞赏</button>
        <button data-action="resetAll">重开</button>
      </nav>
    </header>

    <div class="step-row" id="stepRow">
      <div id="sd1" class="step-dot active"></div>
      <div id="sd2" class="step-dot"></div>
      <div id="sd3" class="step-dot"></div>
    </div>

    <div id="dynamicPanels">
      <div id="tiyongArea" class="panel tiyong-panel">
        <div class="tiyong-bar" id="tiyongBar"></div>
      </div>
      <div id="coreArea" class="panel core-panel"></div>
      <div id="resultArea" class="panel result-panel"></div>
    </div>

    <div class="static-panel" id="panelTeaching" hidden>
      <h3>📖 新手教程</h3>
      <div id="teachingContent"></div>
    </div>
    <div class="static-panel" id="panelRules" hidden>
      <h3>规则速查</h3>
      <p>♥火（阳） ♦金（阳） ♣木（阴） ♠水（阴） | J/Q/K土 | 红色（阳） 黑色（阴）<br />生我大吉 克我大凶 同我平 我生小凶 我克小吉</p>
    </div>
    <div class="static-panel" id="panelSettings" hidden>
      <h3>AI设置</h3>
      <p class="hint">填入API Key后可使用AI深度解读。Key仅存本地。</p>
      <div class="api-provider-grid" id="providerGrid">
        <button data-value="deepseek" class="selected">DeepSeek</button>
        <button data-value="qwen">千问</button>
        <button data-value="openai">OpenAI</button>
        <button data-value="claude">Claude</button>
        <button data-value="gemini">Gemini</button>
        <button data-value="kimi">Kimi</button>
        <button data-value="zhipu">智谱</button>
        <button data-value="custom">自定义</button>
      </div>
      <input type="password" id="apiKey" placeholder="API Key" />
      <input type="text" id="apiEndpoint" placeholder="API地址（自动填充）" />
      <select id="aiStyle">
        <option value="guide">温和引导者</option>
        <option value="analyst">冷静分析师</option>
        <option value="sharp">犀利直言者</option>
      </select>
      <div class="btn-row">
        <button data-action="saveApiSettings" class="primary small">保存</button>
        <button data-action="testApiConnection" class="outline small">测试连接</button>
        <button data-action="clearApiSettings" class="outline small">清除</button>
      </div>
      <span id="apiStatus">未配置</span>
      <p class="hint" style="margin-top:1vh;font-size:0.7rem;">数据流向：你的问题从浏览器直接发送到所选AI服务商，浮生牌不经过任何中转服务器。</p>
    </div>
    <div class="static-panel" id="panelProfile" hidden>
      <h3>🧑 个人信息</h3>
      <p class="hint">填写后将在解读中自动带入，让分析更贴合你。</p>
      <label>姓名</label>
      <input type="text" id="profileName" placeholder="你的名字" />
      <label>性别</label>
      <select id="profileGender">
        <option value="">请选择</option>
        <option value="男">男</option>
        <option value="女">女</option>
        <option value="其他">其他</option>
      </select>
      <label>出生日期（公历）</label>
      <input type="date" id="birthDate" />
      <label>出生时间（可选）</label>
      <input type="time" id="birthTime" />
      <label>出生地（可选）</label>
      <input type="text" id="birthPlace" placeholder="城市名，如：北京" />
      <label>现居地（可选）</label>
      <input type="text" id="currentPlace" placeholder="城市名，如：上海" />
      <p class="hint" id="baziPreview" style="margin-top:1vh;color:var(--accent);"></p>
      <button data-action="saveProfile" class="primary small">保存</button>
    </div>
    <div class="static-panel" id="panelHistory" hidden>
      <h3>历史记录</h3>
      <div id="historyList"></div>
    </div>

    <!-- 日运类别选择弹窗（带 hidden，由 CSS !important 保证内联 display:flex 不覆盖） -->
    <div id="fortuneTypeModal" hidden style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:999;">
      <div style="background:var(--bg, #1a1626);border:1px solid var(--border, #c9a06055);border-radius:12px;padding:20px;min-width:240px;text-align:center;">
        <h3 style="color:var(--accent, #c9a060);margin-bottom:12px;">☯ 选择日运类型</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
          <button data-action="shareDaily" data-fortune="wealth" class="small outline">💰 财运</button>
          <button data-action="shareDaily" data-fortune="love" class="small outline">🌸 桃花</button>
          <button data-action="shareDaily" data-fortune="noble" class="small outline">🤝 贵人</button>
          <button data-action="shareDaily" data-fortune="career" class="small outline">⚡ 事业</button>
          <button data-action="shareDaily" data-fortune="health" class="small outline">🌿 健康</button>
          <button data-action="shareDaily" data-fortune="overall" class="small outline">☯ 综合</button>
        </div>
        <div class="btn-row" style="margin-top:12px;">
          <button data-action="closeModal" class="small outline">取消</button>
        </div>
      </div>
    </div>

    <div id="toast" hidden></div>
    <div id="modal" hidden><div id="modalContent"></div></div>
    <div id="sharePreview" hidden>
      <canvas id="shareCanvas"></canvas>
      <div class="btn-row">
        <button data-action="saveShareImage" class="primary small">保存到相册</button>
        <button data-action="closeShare" class="outline small">关闭</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/ui.js"></script>
</body>
</html>
