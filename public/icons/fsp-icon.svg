<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141210"/>
      <stop offset="1" stop-color="#23201b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eccf8a"/>
      <stop offset="1" stop-color="#a9833f"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="96" y="96" width="320" height="320" rx="36" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <!-- 半月：观测者的镜 -->
  <circle cx="262" cy="216" r="62" fill="url(#gold)"/>
  <circle cx="236" cy="188" r="68" fill="url(#bg)"/>
  <!-- 眼 -->
  <ellipse cx="256" cy="352" rx="42" ry="26" fill="none" stroke="url(#gold)" stroke-width="12"/>
  <circle cx="256" cy="352" r="11" fill="url(#gold)"/>
